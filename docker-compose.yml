services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learning_english}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning_english}
      POSTGRES_DB: ${POSTGRES_DB:-learning_english}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learning_english}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-learning_english}:${POSTGRES_PASSWORD:-learning_english}@db:5432/${POSTGRES_DB:-learning_english}
      DIRECT_URL: postgresql://${POSTGRES_USER:-learning_english}:${POSTGRES_PASSWORD:-learning_english}@db:5432/${POSTGRES_DB:-learning_english}
      SESSION_SECRET: ${SESSION_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OTP_EMAIL_FROM: ${OTP_EMAIL_FROM:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"

  cloudflare:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file: .env
    #networks:
      #- internal
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data:
